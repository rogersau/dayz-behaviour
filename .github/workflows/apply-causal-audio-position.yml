name: Apply causal audio position fix

on:
  push:
    branches: [feature/audio-cues-direct-identities]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-cues-direct-identities
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Use only observer positions known before the sound
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('internal/cues/audio.go')
          source = path.read_text()
          old = '''func nearestPosition(samples []positionSample, atMS, toleranceMS int64) ([3]float64, bool) {
          \tvar best [3]float64
          \tbestDelta := toleranceMS + 1
          \tfor _, sample := range samples {
          \t\tdelta := sample.timeMS - atMS
          \t\tif delta < 0 {
          \t\t\tdelta = -delta
          \t\t}
          \t\tif delta <= toleranceMS && delta < bestDelta {
          \t\t\tbest, bestDelta = sample.position, delta
          \t\t}
          \t}
          \treturn best, bestDelta <= toleranceMS
          }
          '''
          new = '''func nearestPosition(samples []positionSample, atMS, toleranceMS int64) ([3]float64, bool) {
          \tvar best [3]float64
          \tbestDelta := toleranceMS + 1
          \tfor _, sample := range samples {
          \t\tif sample.timeMS > atMS {
          \t\t\tcontinue
          \t\t}
          \t\tdelta := atMS - sample.timeMS
          \t\tif delta <= toleranceMS && delta < bestDelta {
          \t\t\tbest, bestDelta = sample.position, delta
          \t\t}
          \t}
          \treturn best, bestDelta <= toleranceMS
          }
          '''
          if old not in source:
              raise SystemExit('expected nearestPosition block not found')
          path.write_text(source.replace(old, new))
          PY
          gofmt -w internal/cues/audio.go
      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/cues/audio.go
          git commit -m "fix: use causal observer positions for audio cues"
          git push origin HEAD:feature/audio-cues-direct-identities
