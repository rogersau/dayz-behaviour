name: Retarget PR 8

on:
  push:
    branches: [feature/audio-cues-direct-identities]

permissions:
  pull-requests: write

jobs:
  retarget:
    runs-on: ubuntu-latest
    steps:
      - name: Retarget feature PR to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH repos/${{ github.repository }}/pulls/8 -f base=main
