name: Apply audio documentation default

on:
  push:
    branches: [feature/audio-cues-direct-identities]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-cues-direct-identities
      - name: Update documented movement-audio cadence
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['docs/deployment.md', 'dayz/BehaviourProbe/README.md']:
              path = Path(name)
              source = path.read_text()
              source = source.replace('"audio_context_interval_seconds": 0.5', '"audio_context_interval_seconds": 2.0')
              source = source.replace('| `audio_context_interval_seconds` | `0.5` |', '| `audio_context_interval_seconds` | `2.0` |')
              path.write_text(source)
          PY
      - name: Commit documentation correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/deployment.md dayz/BehaviourProbe/README.md
          git commit -m "docs: update movement audio cadence default"
          git push origin HEAD:feature/audio-cues-direct-identities
