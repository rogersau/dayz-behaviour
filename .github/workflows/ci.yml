name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: |
          gofmt -w ./cmd ./internal ./pkg
          git diff --binary > gofmt.patch
          mapfile -t changed_go_files < <(git diff --name-only --diff-filter=ACM -- '*.go')
          if ((${#changed_go_files[@]})); then
            tar -czf gofmt-source.tar.gz -- "${changed_go_files[@]}"
          fi
          test ! -s gofmt.patch
      - name: Upload formatting patch
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gofmt-patch
          path: |
            gofmt.patch
            gofmt-source.tar.gz
      - name: Fail after formatting patch upload
        if: steps.formatting.outcome == 'failure'
        run: exit 1
      - name: Test schema packages
        run: go test ./pkg/...
      - name: Test internal packages
        id: internal-tests
        continue-on-error: true
        run: go test ./internal/... > internal-tests.log 2>&1
      - name: Upload internal test failure log
        if: steps.internal-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: internal-tests-log
          path: internal-tests.log
      - name: Fail after internal test log upload
        if: steps.internal-tests.outcome == 'failure'
        run: exit 1
      - name: Compile analyse command
        run: go test ./cmd/analyse
      - name: Compile ingestd command
        id: ingestd
        continue-on-error: true
        run: go test ./cmd/ingestd > ingestd-test.log 2>&1
      - name: Upload ingestd failure log
        if: steps.ingestd.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ingestd-test-log
          path: ingestd-test.log
      - name: Fail after ingestd log upload
        if: steps.ingestd.outcome == 'failure'
        run: exit 1
      - name: Compile normalize command
        run: go test ./cmd/normalize
      - name: Compile privacy-delete command
        run: go test ./cmd/privacy-delete
      - name: Compile replay command
        run: go test ./cmd/replay
      - name: Compile retention command
        run: go test ./cmd/retention
      - name: Compile reviewd command
        run: go test ./cmd/reviewd
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build commands
        run: go build ./cmd/...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        env:
          DBA_POSTGRES_PASSWORD: "[REDACTED_SECRET]"
          DBA_QUERY_TOKEN: test-ingest-token
          DBA_REVIEW_TOKEN: test-review-token
          DBA_STEAM_ADMIN_IDS: "76561198000000000"
          DBA_SESSION_SECRET: "[REDACTED_SECRET]"
          DBA_CORE_IMAGE: ghcr.io/rogersau/dayz-behaviour:0.1.0
          DBA_REVIEW_IMAGE: ghcr.io/rogersau/dayz-behaviour-review:0.1.0
          DBA_SERVER_AUTH_HOST_FILE: ./deploy/server-auth.example.json
          DBA_CLOUDFLARE_TUNNEL_TOKEN: test-tunnel
        run: |
          docker compose -f deploy/compose.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.release.yaml config --quiet
          docker compose -f deploy/compose.yaml -f deploy/compose.release.yaml -f deploy/compose.home.yaml config --quiet
