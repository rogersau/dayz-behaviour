services:
  ingestd:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DBA_LISTEN_ADDR: 0.0.0.0:8080
      DBA_RAW_DIR: /data/raw
      DBA_QUERY_TOKEN: ${DBA_QUERY_TOKEN:?set DBA_QUERY_TOKEN}
      DBA_MAX_REQUEST_BYTES: 2097152
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - telemetry-data:/data
    restart: unless-stopped

volumes:
  telemetry-data:
