<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">How Scoring Works</title><desc id="desc">DayZ Behaviour uses readiness lift, uncertainty and validation gates to assign review tiers. It does not calculate a cheat probability.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 28px Arial;fill:#fff;text-anchor:middle}.h{font:700 34px Arial;fill:#071b48;text-anchor:middle}.b{font:24px Arial;fill:#223657;text-anchor:middle}.small{font:22px Arial;fill:#223657}.arrow{fill:#1764d8}.section{font:700 36px Arial;fill:#071b48}.boxh{font:700 27px Arial;fill:#071b48}.boxb{font:22px Arial;fill:#334868}.tier{font:700 25px Arial}.note{font:700 28px Arial;fill:#071b48}</style></defs>
  <rect width="1600" height="1000" fill="#fff"/><text x="800" y="82" class="t" text-anchor="middle">How Scoring Works</text><text x="800" y="132" class="st" text-anchor="middle">There is no cheat probability or single incident score — evidence must pass several transparent gates.</text>

  <g filter="url(#s)">
    <g transform="translate(35 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">1</text><text class="h" x="135" y="108">Build observations</text><g transform="translate(55 145)"><circle cx="45" cy="50" r="30" fill="#e66565"/><circle cx="150" cy="50" r="30" fill="#1764d8"/><path d="M75 50h45" stroke="#8ba5ca" stroke-width="7" stroke-dasharray="12 10"/><rect x="89" y="18" width="22" height="64" fill="#6c7890"/><path d="M30 118h140" stroke="#b7c9e7" stroke-width="5"/><path d="M45 105v26M150 105v26" stroke="#1764d8" stroke-width="7"/></g><text class="b" x="135" y="310"><tspan x="135">Compare validated hidden-target</tspan><tspan x="135" dy="31">opportunities with neutral</tspan><tspan x="135" dy="31">no-target opportunities.</tspan></text></g>
    <g transform="translate(350 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">2</text><text class="h" x="135" y="108">Remove explanations</text><g transform="translate(47 145)"><path d="M10 52h38l32-28v108l-32-28H10z" fill="#1764d8" stroke="#071b48" stroke-width="6"/><path d="M95 48q28 28 0 58M120 32q44 43 0 88" fill="none" stroke="#071b48" stroke-width="8"/><ellipse cx="168" cy="67" rx="18" ry="35" fill="#55beb4" transform="rotate(-18 168 67)"/><ellipse cx="142" cy="109" rx="16" ry="30" fill="#55beb4" transform="rotate(15 142 109)"/><circle cx="195" cy="130" r="28" fill="#58c3b7"/><path d="M181 130l10 11 19-26" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g><text class="b" x="135" y="300"><tspan x="135">Known or plausible vision,</tspan><tspan x="135" dy="31">gunshot and footstep cues do</tspan><tspan x="135" dy="31">not enter the primary feature.</tspan></text></g>
    <g transform="translate(665 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">3</text><text class="h" x="135" y="108">Estimate lift</text><g transform="translate(44 145)"><rect x="20" y="70" width="35" height="80" rx="5" fill="#86d9d0"/><rect x="75" y="35" width="35" height="115" rx="5" fill="#247f86"/><rect x="135" y="95" width="35" height="55" rx="5" fill="#b9c9e2"/><path d="M12 158h175" stroke="#071b48" stroke-width="5"/><path d="M20 16h150" stroke="#1764d8" stroke-width="5"/><path d="M20 16l14-10v20z" fill="#1764d8"/></g><text class="b" x="135" y="298"><tspan x="135">Readiness lift = hidden</tspan><tspan x="135" dy="31">posterior rate minus neutral</tspan><tspan x="135" dy="31">posterior rate.</tspan><tspan x="135" dy="31">Use the lower confidence bound.</tspan></text></g>
    <g transform="translate(980 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">4</text><text class="h" x="135" y="108">Check breadth</text><g transform="translate(55 145)"><circle cx="45" cy="42" r="27" fill="#1764d8"/><path d="M12 112q0-48 33-48t33 48z" fill="#1764d8"/><circle cx="128" cy="42" r="27" fill="#55beb4"/><path d="M95 112q0-48 33-48t33 48z" fill="#55beb4"/><circle cx="86" cy="135" r="30" fill="#4d3b7b"/><path d="M49 205q0-55 37-55t37 55z" fill="#4d3b7b"/></g><text class="b" x="135" y="365"><tspan x="135">At least 20 hidden trials,</tspan><tspan x="135" dy="30">3 sessions, 5 encounters</tspan><tspan x="135" dy="30">and 5 target identities.</tspan></text></g>
    <g transform="translate(1295 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">5</text><text class="h" x="135" y="108">Validate pattern</text><g transform="translate(50 145)"><rect x="0" y="0" width="170" height="150" rx="18" fill="#f5f9ff" stroke="#bcd6fa" stroke-width="4"/><path d="M28 38h18l10 12 20-27M28 77h18l10 12 20-27M28 116h18l10 12 20-27" fill="none" stroke="#247f86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M95 40h50M95 79h50M95 118h50" stroke="#7b91b4" stroke-width="6" stroke-linecap="round"/></g><text class="b" x="135" y="323"><tspan x="135">Matched model converges,</tspan><tspan x="135" dy="30">effect is stable across sessions,</tspan><tspan x="135" dy="30">and negative controls pass.</tspan></text></g>
  </g>
  <path class="arrow" d="M312 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM627 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM942 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM1257 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25z"/>

  <text x="800" y="645" class="section" text-anchor="middle">Review tier assignment</text>
  <g transform="translate(70 690)"><rect width="335" height="155" rx="24" fill="#f2f4f8" stroke="#cfd7e5" stroke-width="3"/><text x="30" y="48" class="tier" fill="#56657d">INSUFFICIENT DATA</text><text x="30" y="86" class="small"><tspan x="30">Breadth requirements</tspan><tspan x="30" dy="30">were not met.</tspan></text></g>
  <g transform="translate(445 690)"><rect width="335" height="155" rx="24" fill="#fff9e7" stroke="#f0cf62" stroke-width="3"/><text x="30" y="48" class="tier" fill="#b27900">MONITOR</text><text x="30" y="86" class="small"><tspan x="30">Enough data, but the lower</tspan><tspan x="30" dy="30">bound is below 0.05.</tspan></text></g>
  <g transform="translate(820 690)"><rect width="335" height="155" rx="24" fill="#fff1e7" stroke="#f2a45c" stroke-width="3"/><text x="30" y="48" class="tier" fill="#d26915">REVIEW</text><text x="30" y="86" class="small"><tspan x="30">Readiness-lift lower bound</tspan><tspan x="30" dy="30">is at least 0.05.</tspan></text></g>
  <g transform="translate(1195 690)"><rect width="335" height="155" rx="24" fill="#fff0f0" stroke="#eb7777" stroke-width="3"/><text x="30" y="48" class="tier" fill="#cf3232">HIGH PRIORITY</text><text x="30" y="86" class="small"><tspan x="30">Lower bound at least 0.15</tspan><tspan x="30" dy="30">and every extra gate passes.</tspan></text></g>

  <rect x="85" y="890" width="1430" height="75" rx="22" fill="#f4f9ff" stroke="#bcd6fa" stroke-width="2"/><text x="800" y="937" class="note" text-anchor="middle">The tier prioritises manual review. It is not a cheat probability and cannot trigger an automatic ban.</text>
</svg>