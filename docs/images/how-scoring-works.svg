<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183765" flood-opacity="0.12"/></filter></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="70" text-anchor="middle" font-family="Arial" font-size="64" font-weight="700" fill="#08245a">How Scoring Works</text><text x="800" y="120" text-anchor="middle" font-family="Arial" font-size="26" fill="#51617d">Several evidence gates decide which repeated patterns need human review.</text><g font-family="Arial" text-anchor="middle"><rect x="30" y="175" width="270" height="430" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="165" cy="215" r="27" fill="#1769e8"/><text x="165" y="224" font-size="28" font-weight="700" fill="#fff">1</text><text x="165" y="275" font-size="30" font-weight="700" fill="#08245a">Observe</text><path d="M116 365Q165 323 214 365Q165 407 116 365Z" fill="#e6fbf6" stroke="#08245a" stroke-width="6"/><circle cx="165" cy="365" r="32" fill="#48b9ae" stroke="#08245a" stroke-width="5"/><circle cx="165" cy="365" r="12" fill="#08245a"/><line x1="55" y1="465" x2="275" y2="465" stroke="#a9caff" stroke-width="2"/><text x="165" y="510" font-size="18" fill="#172744">Record a hidden-target</text><text x="165" y="532" font-size="18" fill="#172744">opportunity and reaction.</text><path d="M305 365h12" stroke="#1769e8" stroke-width="8"/><path d="M303 348l32 17-32 17z" fill="#1769e8"/><rect x="340" y="175" width="270" height="430" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="475" cy="215" r="27" fill="#1769e8"/><text x="475" y="224" font-size="28" font-weight="700" fill="#fff">2</text><text x="475" y="275" font-size="27" font-weight="700" fill="#08245a">Check explanations</text><rect x="400" y="350" width="20" height="30" rx="6" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M420 350l23-18v66l-23-18z" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M454 347q17 18 0 36" fill="none" stroke="#08245a" stroke-width="7"/><ellipse cx="527" cy="399" rx="19" ry="31" transform="rotate(-20 527 399)" fill="#48b9ae"/><ellipse cx="553" cy="387" rx="19" ry="31" transform="rotate(18 553 387)" fill="#48b9ae"/><line x1="365" y1="465" x2="585" y2="465" stroke="#a9caff" stroke-width="2"/><text x="475" y="510" font-size="18" fill="#172744">Check vision and</text><text x="475" y="532" font-size="18" fill="#172744">audio explanations.</text><path d="M615 365h12" stroke="#1769e8" stroke-width="8"/><path d="M613 348l32 17-32 17z" fill="#1769e8"/><rect x="650" y="175" width="270" height="430" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="785" cy="215" r="27" fill="#1769e8"/><text x="785" y="224" font-size="28" font-weight="700" fill="#fff">3</text><text x="785" y="275" font-size="30" font-weight="700" fill="#08245a">Measure evidence</text><rect x="749" y="381" width="24" height="55" fill="#48b9ae"/><rect x="775" y="362" width="24" height="85" fill="#48b9ae"/><rect x="801" y="336" width="24" height="125" fill="#48b9ae"/><line x1="736" y1="418" x2="834" y2="418" stroke="#08245a" stroke-width="5"/><line x1="675" y1="465" x2="895" y2="465" stroke="#a9caff" stroke-width="2"/><text x="785" y="510" font-size="18" fill="#172744">Readiness, controls,</text><text x="785" y="532" font-size="18" fill="#172744">stability and validation.</text><path d="M925 365h12" stroke="#1769e8" stroke-width="8"/><path d="M923 348l32 17-32 17z" fill="#1769e8"/><rect x="960" y="175" width="270" height="430" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="1095" cy="215" r="27" fill="#1769e8"/><text x="1095" y="224" font-size="28" font-weight="700" fill="#fff">4</text><text x="1095" y="275" font-size="30" font-weight="700" fill="#08245a">Apply gates</text><path d="M1043 381A52 52 0 0 1 1147 381" fill="none" stroke="#d6eef0" stroke-width="28"/><path d="M1043 381A52 52 0 0 1 1118 329" fill="none" stroke="#48b9ae" stroke-width="28"/><line x1="1095" y1="381" x2="1124" y2="349" stroke="#08245a" stroke-width="9"/><circle cx="1095" cy="381" r="14" fill="#08245a"/><line x1="985" y1="465" x2="1205" y2="465" stroke="#a9caff" stroke-width="2"/><text x="1095" y="510" font-size="18" fill="#172744">Evidence must pass</text><text x="1095" y="532" font-size="18" fill="#172744">transparent gates.</text><path d="M1235 365h12" stroke="#1769e8" stroke-width="8"/><path d="M1233 348l32 17-32 17z" fill="#1769e8"/><rect x="1270" y="175" width="270" height="430" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="1405" cy="215" r="27" fill="#1769e8"/><text x="1405" y="224" font-size="28" font-weight="700" fill="#fff">5</text><text x="1405" y="275" font-size="30" font-weight="700" fill="#08245a">Review</text><circle cx="1369" cy="347" r="32" fill="#50647f"/><path d="M1341 403Q1369 369 1397 403v35h-90Z" fill="#50647f" stroke="#08245a" stroke-width="4"/><rect x="1402" y="330" width="71" height="62" rx="8" fill="#fff" stroke="#08245a" stroke-width="7"/><path d="M1437 349l32 13v30c0 28-32 42-32 42s-32-14-32-42v-30Z" fill="#48b9ae" stroke="#08245a" stroke-width="4"/><text x="1437" y="379" font-size="38" font-weight="700" fill="#fff">!</text><line x1="1295" y1="465" x2="1515" y2="465" stroke="#a9caff" stroke-width="2"/><text x="1405" y="510" font-size="18" fill="#172744">Qualifying patterns</text><text x="1405" y="532" font-size="18" fill="#172744">become review cases.</text><text x="800" y="655" font-size="36" font-weight="700" fill="#08245a">What determines the review tier</text><rect x="110" y="700" width="440" height="70" rx="16" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="145" cy="735" r="14" fill="#48b9ae"/><text x="175" y="729" text-anchor="start" font-size="21" font-weight="700" fill="#08245a">Readiness lift</text><text x="175" y="755" text-anchor="start" font-size="14" fill="#51617d">Hidden rate minus neutral-control rate.</text><rect x="610" y="700" width="440" height="70" rx="16" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="645" cy="735" r="14" fill="#48b9ae"/><text x="675" y="729" text-anchor="start" font-size="21" font-weight="700" fill="#08245a">Breadth</text><text x="675" y="755" text-anchor="start" font-size="14" fill="#51617d">Enough sessions, encounters and targets.</text><rect x="1110" y="700" width="440" height="70" rx="16" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="1145" cy="735" r="14" fill="#48b9ae"/><text x="1175" y="729" text-anchor="start" font-size="21" font-weight="700" fill="#08245a">Matched evidence</text><text x="1175" y="755" text-anchor="start" font-size="14" fill="#51617d">Context-matched lower bound is positive.</text><rect x="110" y="785" width="440" height="70" rx="16" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="145" cy="820" r="14" fill="#48b9ae"/><text x="175" y="814" text-anchor="start" font-size="21" font-weight="700" fill="#08245a">Consistency</text><text x="175" y="840" text-anchor="start" font-size="14" fill="#51617d">Effect repeats across sessions.</text><rect x="610" y="785" width="440" height="70" rx="16" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="645" cy="820" r="14" fill="#48b9ae"/><text x="675" y="814" text-anchor="start" font-size="21" font-weight="700" fill="#08245a">Explanations</text><text x="675" y="840" text-anchor="start" font-size="14" fill="#51617d">Known cues remove primary evidence.</text><rect x="1110" y="785" width="440" height="70" rx="16" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="1145" cy="820" r="14" fill="#48b9ae"/><text x="1175" y="814" text-anchor="start" font-size="21" font-weight="700" fill="#08245a">Negative controls</text><text x="1175" y="840" text-anchor="start" font-size="14" fill="#51617d">Validation checks must pass.</text></g></svg>