<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">How Scoring Works</title><desc id="desc">Review priority is based on readiness lift, uncertainty, evidence breadth and validation gates.</desc><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 28px Arial;fill:#fff;text-anchor:middle}.h{font:700 34px Arial;fill:#071b48;text-anchor:middle}.b{font:24px Arial;fill:#223657;text-anchor:middle}.a{fill:#1764d8}.section{font:700 36px Arial;fill:#071b48}.small{font:22px Arial;fill:#334868}.tier{font:700 25px Arial}.note{font:700 28px Arial;fill:#071b48}</style></defs><rect width="1600" height="1000" fill="#fff"/><text x="800" y="82" class="t" text-anchor="middle">How Scoring Works</text><text x="800" y="132" class="st" text-anchor="middle">There is no cheat probability or single incident score — evidence must pass transparent gates.</text><g filter="url(#s)"><g transform="translate(35 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">1</text><text class="h" x="135" y="108">Build observations</text><circle cx="90" cy="215" r="28" fill="#e66565"/><circle cx="185" cy="215" r="28" fill="#1764d8"/><rect x="128" y="175" width="18" height="80" fill="#6c7890"/><text class="b" x="135" y="310"><tspan x="135">Compare validated hidden</tspan><tspan x="135" dy="31">opportunities with neutral</tspan><tspan x="135" dy="31">no-target opportunities.</tspan></text></g><g transform="translate(350 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">2</text><text class="h" x="135" y="108">Remove explanations</text><path d="M65 205h38l32-28v108l-32-28H65z" fill="#1764d8" stroke="#071b48" stroke-width="6"/><path d="M150 198q28 28 0 58M176 180q44 43 0 88" fill="none" stroke="#071b48" stroke-width="8"/><circle cx="215" cy="265" r="28" fill="#58c3b7"/><text class="b" x="135" y="300"><tspan x="135">Known or plausible vision,</tspan><tspan x="135" dy="31">gunshot and footstep cues</tspan><tspan x="135" dy="31">do not enter the primary feature.</tspan></text></g><g transform="translate(665 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">3</text><text class="h" x="135" y="108">Estimate lift</text><rect x="70" y="245" width="34" height="70" rx="5" fill="#86d9d0"/><rect x="118" y="205" width="34" height="110" rx="5" fill="#247f86"/><rect x="166" y="265" width="34" height="50" rx="5" fill="#b9c9e2"/><path d="M60 325h150" stroke="#071b48" stroke-width="5"/><text class="b" x="135" y="355"><tspan x="135">Hidden posterior rate minus</tspan><tspan x="135" dy="30">neutral posterior rate.</tspan></text></g><g transform="translate(980 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">4</text><text class="h" x="135" y="108">Check breadth</text><circle cx="95" cy="205" r="28" fill="#1764d8"/><circle cx="175" cy="205" r="28" fill="#55beb4"/><circle cx="135" cy="275" r="30" fill="#4d3b7b"/><text class="b" x="135" y="345"><tspan x="135">20 hidden trials, 3 sessions,</tspan><tspan x="135" dy="30">5 encounters and 5 targets.</tspan></text></g><g transform="translate(1295 185)"><rect class="c" width="270" height="390" rx="25"/><circle class="n" cx="50" cy="48" r="30"/><text class="nt" x="50" y="58">5</text><text class="h" x="135" y="108">Validate pattern</text><rect x="55" y="165" width="160" height="150" rx="18" fill="#f5f9ff" stroke="#bcd6fa" stroke-width="4"/><path d="M80 205h18l10 12 20-27M80 245h18l10 12 20-27M80 285h18l10 12 20-27" fill="none" stroke="#247f86" stroke-width="7" stroke-linecap="round"/><text class="b" x="135" y="350"><tspan x="135">Matched model, stability and</tspan><tspan x="135" dy="30">negative controls must pass.</tspan></text></g></g><path class="a" d="M312 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM627 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM942 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM1257 367h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25z"/><text x="800" y="645" class="section" text-anchor="middle">Review tier assignment</text><g transform="translate(70 690)"><rect width="335" height="155" rx="24" fill="#f2f4f8" stroke="#cfd7e5" stroke-width="3"/><text x="30" y="48" class="tier" fill="#56657d">INSUFFICIENT DATA</text><text x="30" y="86" class="small"><tspan x="30">Breadth requirements</tspan><tspan x="30" dy="30">were not met.</tspan></text></g><g transform="translate(445 690)"><rect width="335" height="155" rx="24" fill="#fff9e7" stroke="#f0cf62" stroke-width="3"/><text x="30" y="48" class="tier" fill="#b27900">MONITOR</text><text x="30" y="86" class="small"><tspan x="30">Enough data, but the lower</tspan><tspan x="30" dy="30">bound is below 0.05.</tspan></text></g><g transform="translate(820 690)"><rect width="335" height="155" rx="24" fill="#fff1e7" stroke="#f2a45c" stroke-width="3"/><text x="30" y="48" class="tier" fill="#d26915">REVIEW</text><text x="30" y="86" class="small"><tspan x="30">Readiness-lift lower bound</tspan><tspan x="30" dy="30">is at least 0.05.</tspan></text></g><g transform="translate(1195 690)"><rect width="335" height="155" rx="24" fill="#fff0f0" stroke="#eb7777" stroke-width="3"/><text x="30" y="48" class="tier" fill="#cf3232">HIGH PRIORITY</text><text x="30" y="86" class="small"><tspan x="30">Lower bound at least 0.15</tspan><tspan x="30" dy="30">and every extra gate passes.</tspan></text></g><rect x="85" y="890" width="1430" height="75" rx="22" fill="#f4f9ff" stroke="#bcd6fa" stroke-width="2"/><text x="800" y="937" class="note" text-anchor="middle">The tier prioritises manual review. It is not a cheat probability and cannot trigger an automatic ban.</text></svg>