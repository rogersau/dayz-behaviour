<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How a Case Gets Flagged</title><desc id="desc">Four-step flow: observe, explain, score and review.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 29px Arial;fill:#fff;text-anchor:middle}.h{font:700 42px Arial;fill:#071b48;text-anchor:middle}.b{font:27px Arial;fill:#223657;text-anchor:middle}.arrow{fill:#1764d8}.foot{font:700 30px Arial;fill:#071b48}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="92" class="t" text-anchor="middle">How a Case Gets Flagged</text><text x="800" y="145" class="st" text-anchor="middle">Only repeated, unexplained patterns are prioritised for administrators.</text>
  <g filter="url(#s)">
    <g transform="translate(55 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">1</text><text class="h" x="170" y="125">Observe</text><g transform="translate(70 165)"><path d="M10 95q100-115 200 0-100 115-200 0z" fill="none" stroke="#071b48" stroke-width="12"/><circle cx="110" cy="95" r="42" fill="#55beb4" stroke="#071b48" stroke-width="8"/><circle cx="110" cy="95" r="15" fill="#fff"/><circle cx="205" cy="155" r="32" fill="#1764d8"/><text x="205" y="166" text-anchor="middle" style="font:700 34px Arial;fill:#fff">!</text></g><text class="b" x="170" y="380"><tspan x="170">A player reacts near a hidden,</tspan><tspan x="170" dy="36">distant or unexpected target.</tspan></text></g>
    <g transform="translate(430 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">2</text><text class="h" x="170" y="125">Explain</text><g transform="translate(60 165)"><path d="M10 62h48l38-34v128l-38-34H10z" fill="#1764d8" stroke="#071b48" stroke-width="7"/><path d="M116 55q34 36 0 72M148 35q58 58 0 112" fill="none" stroke="#071b48" stroke-width="10"/><ellipse cx="205" cy="80" rx="21" ry="42" fill="#4baea7" transform="rotate(-18 205 80)"/><ellipse cx="174" cy="132" rx="19" ry="36" fill="#4baea7" transform="rotate(15 174 132)"/></g><text class="b" x="170" y="365"><tspan x="170">Check line of sight, gunshots,</tspan><tspan x="170" dy="36">footsteps and nearby activity.</tspan></text></g>
    <g transform="translate(805 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">3</text><text class="h" x="170" y="125">Score</text><g transform="translate(83 165)"><circle cx="90" cy="88" r="78" fill="#f6fbff" stroke="#071b48" stroke-width="10"/><rect x="45" y="90" width="18" height="40" rx="4" fill="#55beb4"/><rect x="78" y="66" width="18" height="64" rx="4" fill="#55beb4"/><rect x="111" y="40" width="18" height="90" rx="4" fill="#247f86"/><circle cx="133" cy="129" r="34" fill="#fff" stroke="#071b48" stroke-width="7"/><path d="M156 153l35 35" stroke="#071b48" stroke-width="13" stroke-linecap="round"/></g><text class="b" x="170" y="380"><tspan x="170">Measure whether the pattern is</tspan><tspan x="170" dy="36">strong, repeated and unusual.</tspan></text></g>
    <g transform="translate(1180 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">4</text><text class="h" x="170" y="125">Review</text><g transform="translate(76 165)"><circle cx="48" cy="62" r="35" fill="#344969"/><path d="M5 160q0-66 43-66t43 66z" fill="#344969"/><rect x="104" y="35" width="126" height="112" rx="10" fill="#fff" stroke="#243757" stroke-width="9"/><path d="M167 56l32 12v24c0 24-13 41-32 52-19-11-32-28-32-52V68z" fill="#58c3b7" stroke="#247f86" stroke-width="5"/></g><text class="b" x="170" y="365"><tspan x="170">The highest-priority evidence</tspan><tspan x="170" dy="36">is sent to human admins.</tspan></text></g>
  </g>
  <path class="arrow" d="M400 447h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM775 447h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM1150 447h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25z"/>
  <g transform="translate(160 770)"><rect width="570" height="86" rx="24" fill="#f4f9ff" stroke="#bdd5f8" stroke-width="2"/><path d="M50 18l30 12v20c0 21-12 35-30 45-18-10-30-24-30-45V30z" fill="#1764d8"/><text x="330" y="55" class="foot" text-anchor="middle">No automatic bans</text></g>
  <g transform="translate(870 770)"><rect width="570" height="86" rx="24" fill="#effaf8" stroke="#b8e6df" stroke-width="2"/><circle cx="55" cy="32" r="18" fill="#247f86"/><path d="M24 74q0-36 31-36t31 36z" fill="#247f86"/><text x="330" y="55" class="foot" text-anchor="middle">Admins make the final decision</text></g>
</svg>