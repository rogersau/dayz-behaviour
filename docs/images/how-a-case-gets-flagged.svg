<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183765" flood-opacity="0.12"/></filter><linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#effaff"/><stop offset="1" stop-color="#e9f6f1"/></linearGradient></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="64" fill="#08245a">How a Case Gets Flagged</text><text x="800" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#51617d">Only the most suspicious repeated patterns are sent to admins.</text><rect x="95" y="190" width="310" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="250" cy="235" r="27" fill="#1769e8"/><text x="250" y="244" text-anchor="middle" font-family="Arial" font-weight="700" font-size="28" fill="#fff">1</text><text x="250" y="315" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#08245a">Observe</text><path d="M186.25 420Q250 364.75 313.75 420Q250 475.25 186.25 420Z" fill="#e6fbf6" stroke="#08245a" stroke-width="6"/><circle cx="250" cy="420" r="32" fill="#48b9ae" stroke="#08245a" stroke-width="5"/><circle cx="250" cy="420" r="12" fill="#08245a"/><circle cx="241.5" cy="409.8" r="7" fill="#fff"/><circle cx="340" cy="480" r="28" fill="#48b9ae"/><text x="340" y="491" text-anchor="middle" font-family="Arial" font-weight="700" font-size="32" fill="#fff">!</text><line x1="125" y1="525" x2="375" y2="525" stroke="#a9caff" stroke-width="2"/><text x="250" y="575" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">Player reacts near a</text><text x="250" y="601" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">hidden or distant target.</text><path d="M415 420h22" stroke="#1769e8" stroke-width="8"/><path d="M423 403l32 17-32 17z" fill="#1769e8"/><rect x="465" y="190" width="310" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="620" cy="235" r="27" fill="#1769e8"/><text x="620" y="244" text-anchor="middle" font-family="Arial" font-weight="700" font-size="28" fill="#fff">2</text><text x="620" y="315" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#08245a">Explain</text><rect x="527" y="402" width="24" height="36" rx="6" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M551 402l27-21v78l-27-21z" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M591.8 397.8q20.4 22.2 0 44.4" fill="none" stroke="#08245a" stroke-width="7"/><path d="M605 385.8q30 34.2 0 68.4" fill="none" stroke="#08245a" stroke-width="7"/><ellipse cx="674.4" cy="460.2" rx="19" ry="31" transform="rotate(-20 674.4 460.2)" fill="#48b9ae"/><ellipse cx="705.6" cy="445.25" rx="19" ry="31" transform="rotate(18 705.6 445.25)" fill="#48b9ae"/><line x1="495" y1="525" x2="745" y2="525" stroke="#a9caff" stroke-width="2"/><text x="620" y="575" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">Check vision, gunshots,</text><text x="620" y="601" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">footsteps and activity.</text><path d="M785 420h22" stroke="#1769e8" stroke-width="8"/><path d="M793 403l32 17-32 17z" fill="#1769e8"/><rect x="835" y="190" width="310" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="990" cy="235" r="27" fill="#1769e8"/><text x="990" y="244" text-anchor="middle" font-family="Arial" font-weight="700" font-size="28" fill="#fff">3</text><text x="990" y="315" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#08245a">Measure</text><rect x="936" y="440" width="24" height="55" fill="#48b9ae"/><rect x="968" y="416" width="24" height="85" fill="#48b9ae"/><rect x="1000" y="384" width="24" height="125" fill="#48b9ae"/><line x1="920" y1="485" x2="1040" y2="485" stroke="#08245a" stroke-width="5"/><circle cx="1055" cy="405" r="52" fill="none" stroke="#08245a" stroke-width="8"/><line x1="1091" y1="441" x2="1128" y2="478" stroke="#08245a" stroke-width="13"/><line x1="865" y1="525" x2="1115" y2="525" stroke="#a9caff" stroke-width="2"/><text x="990" y="575" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">Compare neutral controls</text><text x="990" y="601" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">and repeated behaviour.</text><path d="M1155 420h22" stroke="#1769e8" stroke-width="8"/><path d="M1163 403l32 17-32 17z" fill="#1769e8"/><rect x="1205" y="190" width="310" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="1360" cy="235" r="27" fill="#1769e8"/><text x="1360" y="244" text-anchor="middle" font-family="Arial" font-weight="700" font-size="28" fill="#fff">4</text><text x="1360" y="315" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#08245a">Review</text><circle cx="1316.5" cy="396.25" r="32" fill="#50647f"/><path d="M1282.75 463.75Q1316.5 422.5 1350.25 463.75v35h-90Z" fill="#50647f" stroke="#08245a" stroke-width="4"/><rect x="1356.25" y="376" width="86.25" height="75" rx="8" fill="#fff" stroke="#08245a" stroke-width="7"/><path d="M1399 398.5l32 13v30c0 28-32 42-32 42s-32-14-32-42v-30Z" fill="#48b9ae" stroke="#08245a" stroke-width="4"/><text x="1399" y="435.25" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#fff">!</text><line x1="1235" y1="525" x2="1485" y2="525" stroke="#a9caff" stroke-width="2"/><text x="1360" y="575" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">Only qualifying cases</text><text x="1360" y="601" text-anchor="middle" font-family="Arial" font-size="21" fill="#172744">go to human admins.</text><rect x="150" y="750" width="570" height="95" rx="20" fill="#fbfdff" stroke="#b9d4ff" stroke-width="2"/><text x="435" y="808" text-anchor="middle" font-family="Arial" font-weight="700" font-size="32" fill="#08245a">No automatic bans</text><rect x="880" y="750" width="570" height="95" rx="20" fill="url(#soft)" stroke="#b9d4ff" stroke-width="2"/><text x="1165" y="808" text-anchor="middle" font-family="Arial" font-weight="700" font-size="32" fill="#08245a">Admins make the final decision</text></svg>