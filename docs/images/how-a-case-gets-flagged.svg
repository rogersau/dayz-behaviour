<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">How a Case Gets Flagged</title><desc id="desc">Four-step flow: observe, explain, score and review.</desc><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 29px Arial;fill:#fff;text-anchor:middle}.h{font:700 42px Arial;fill:#071b48;text-anchor:middle}.b{font:27px Arial;fill:#223657;text-anchor:middle}.a{fill:#1764d8}.foot{font:700 30px Arial;fill:#071b48}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="92" class="t" text-anchor="middle">How a Case Gets Flagged</text><text x="800" y="145" class="st" text-anchor="middle">Only repeated, unexplained patterns are prioritised for administrators.</text><g filter="url(#s)"><g transform="translate(55 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">1</text><text class="h" x="170" y="125">Observe</text><path d="M85 300q85-100 170 0-85 100-170 0z" fill="none" stroke="#071b48" stroke-width="12"/><circle cx="170" cy="300" r="40" fill="#55beb4" stroke="#071b48" stroke-width="8"/><circle cx="250" cy="355" r="30" fill="#1764d8"/><text x="250" y="366" text-anchor="middle" style="font:700 34px Arial;fill:#fff">!</text><text class="b" x="170" y="480"><tspan x="170">A player reacts near a hidden,</tspan><tspan x="170" dy="36">distant or unexpected target.</tspan></text></g><g transform="translate(430 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">2</text><text class="h" x="170" y="125">Explain</text><path d="M95 265h45l36-31v120l-36-31H95z" fill="#1764d8" stroke="#071b48" stroke-width="7"/><path d="M195 258q32 34 0 68M226 240q51 50 0 98" fill="none" stroke="#071b48" stroke-width="9"/><ellipse cx="267" cy="292" rx="18" ry="37" fill="#4baea7" transform="rotate(-18 267 292)"/><text class="b" x="170" y="465"><tspan x="170">Check line of sight, gunshots,</tspan><tspan x="170" dy="36">footsteps and nearby activity.</tspan></text></g><g transform="translate(805 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">3</text><text class="h" x="170" y="125">Score</text><circle cx="160" cy="300" r="82" fill="#f6fbff" stroke="#071b48" stroke-width="10"/><rect x="112" y="305" width="20" height="48" rx="4" fill="#55beb4"/><rect x="148" y="275" width="20" height="78" rx="4" fill="#55beb4"/><rect x="184" y="240" width="20" height="113" rx="4" fill="#247f86"/><text class="b" x="170" y="480"><tspan x="170">Measure whether the pattern is</tspan><tspan x="170" dy="36">strong, repeated and unusual.</tspan></text></g><g transform="translate(1180 215)"><rect class="c" width="340" height="500" rx="28"/><circle class="n" cx="170" cy="55" r="34"/><text class="nt" x="170" y="65">4</text><text class="h" x="170" y="125">Review</text><circle cx="125" cy="285" r="35" fill="#344969"/><path d="M80 390q0-70 45-70t45 70z" fill="#344969"/><rect x="185" y="255" width="118" height="110" rx="10" fill="#fff" stroke="#243757" stroke-width="9"/><path d="M244 275l31 12v23c0 23-13 39-31 50-18-11-31-27-31-50v-23z" fill="#58c3b7"/><text class="b" x="170" y="465"><tspan x="170">The highest-priority evidence</tspan><tspan x="170" dy="36">is sent to human admins.</tspan></text></g></g><path class="a" d="M400 447h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM775 447h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM1150 447h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25z"/><g transform="translate(160 770)"><rect width="570" height="86" rx="24" fill="#f4f9ff" stroke="#bdd5f8" stroke-width="2"/><text x="285" y="55" class="foot" text-anchor="middle">No automatic bans</text></g><g transform="translate(870 770)"><rect width="570" height="86" rx="24" fill="#effaf8" stroke="#b8e6df" stroke-width="2"/><text x="285" y="55" class="foot" text-anchor="middle">Admins make the final decision</text></g></svg>