<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">What the System Looks At</title><desc id="desc">Vision, audio and gameplay context used by DayZ Behaviour.</desc><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.h{font:700 48px Arial;fill:#1764d8;text-anchor:middle}.b{font:29px Arial;fill:#223657}.dot{fill:#1764d8}.note{font:700 31px Arial;fill:#071b48}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="88" class="t" text-anchor="middle">What the System Looks At</text><text x="800" y="140" class="st" text-anchor="middle">Player behaviour is compared with what they could reasonably see, hear and know.</text><g filter="url(#s)"><g transform="translate(95 205)"><rect class="c" width="430" height="500" rx="28"/><circle cx="215" cy="118" r="82" fill="#d9f6f1"/><path d="M125 118q90-96 180 0-90 96-180 0z" fill="none" stroke="#071b48" stroke-width="10"/><circle cx="215" cy="118" r="30" fill="#1764d8"/><text x="215" y="245" class="h">Vision</text><line x1="55" x2="375" y1="275" y2="275" stroke="#c6daf8" stroke-width="3"/><circle class="dot" cx="75" cy="340" r="9"/><text class="b" x="105" y="350">Line of sight</text><circle class="dot" cx="75" cy="410" r="9"/><text class="b" x="105" y="420">Cover and concealment</text><circle class="dot" cx="75" cy="480" r="9"/><text class="b" x="105" y="490">Timing and distance</text></g><g transform="translate(585 205)"><rect class="c" width="430" height="500" rx="28"/><circle cx="215" cy="118" r="82" fill="#d9f6f1"/><path d="M140 90h40l35-30v116l-35-30h-40z" fill="#1764d8" stroke="#071b48" stroke-width="6"/><path d="M235 84q32 34 0 68M267 65q55 53 0 105" fill="none" stroke="#071b48" stroke-width="9" stroke-linecap="round"/><text x="215" y="245" class="h">Audio</text><line x1="55" x2="375" y1="275" y2="275" stroke="#c6daf8" stroke-width="3"/><circle class="dot" cx="75" cy="340" r="9"/><text class="b" x="105" y="350">Gunshots</text><circle class="dot" cx="75" cy="410" r="9"/><text class="b" x="105" y="420">Footsteps</text><circle class="dot" cx="75" cy="480" r="9"/><text class="b" x="105" y="490">Estimated audibility</text></g><g transform="translate(1075 205)"><rect class="c" width="430" height="500" rx="28"/><circle cx="215" cy="118" r="82" fill="#e7e0f8"/><circle cx="215" cy="90" r="35" fill="#4c397d"/><path d="M150 174q0-68 65-68t65 68z" fill="#4c397d"/><text x="215" y="245" class="h">Context</text><line x1="55" x2="375" y1="275" y2="275" stroke="#c6daf8" stroke-width="3"/><circle class="dot" cx="75" cy="340" r="9"/><text class="b" x="105" y="350">Movement and stance</text><circle class="dot" cx="75" cy="410" r="9"/><text class="b" x="105" y="420">Combat state</text><circle class="dot" cx="75" cy="480" r="9"/><text class="b" x="105" y="490">Nearby activity</text></g></g><rect x="100" y="760" width="1400" height="95" rx="24" fill="#f5f9ff" stroke="#bcd6fa" stroke-width="3"/><text x="800" y="820" class="note" text-anchor="middle">Audio is inferred from server events — no raw audio is recorded.</text></svg>