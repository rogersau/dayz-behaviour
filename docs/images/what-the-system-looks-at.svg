<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183765" flood-opacity="0.12"/></filter><linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#effaff"/><stop offset="1" stop-color="#e9f6f1"/></linearGradient></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="64" fill="#08245a">What the System Looks At</text><text x="800" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#51617d">We compare player behaviour against what they could reasonably see, hear and know.</text><rect x="120" y="190" width="420" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="330" cy="315" r="90" fill="#ddf6f0"/><path d="M 281.25 315 Q 330 272.75 378.75 315 Q 330 357.25 281.25 315 Z" fill="#e6fbf6" stroke="#08245a" stroke-width="6"/><circle cx="330" cy="315" r="32" fill="#48b9ae" stroke="#08245a" stroke-width="5"/><circle cx="330" cy="315" r="12" fill="#08245a"/><circle cx="323.5" cy="307.2" r="7" fill="#fff"/><text x="330" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="44" fill="#1769e8">Vision</text><line x1="160" y1="495" x2="500" y2="495" stroke="#a9caff" stroke-width="3"/><circle cx="170" cy="555" r="7" fill="#1769e8"/><text x="205" y="565" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Line of sight</text><circle cx="170" cy="610" r="7" fill="#1769e8"/><text x="205" y="620" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Cover and concealment</text><circle cx="170" cy="665" r="7" fill="#1769e8"/><text x="205" y="675" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Timing and distance</text><rect x="590" y="190" width="420" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="800" cy="315" r="90" fill="#ddf6f0"/><rect x="748" y="295.5" width="26" height="39" rx="6" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M 774 295.5 L 803.25 272.75 L 803.25 357.25 L 774 334.5 Z" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M 818.2 290.95 Q 840.3 315 818.2 339.05" fill="none" stroke="#08245a" stroke-width="7"/><path d="M 832.5 277.95 Q 865 315 832.5 352.05" fill="none" stroke="#08245a" stroke-width="7"/><text x="800" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="44" fill="#1769e8">Audio</text><line x1="630" y1="495" x2="970" y2="495" stroke="#a9caff" stroke-width="3"/><circle cx="640" cy="555" r="7" fill="#1769e8"/><text x="675" y="565" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Gunshots</text><circle cx="640" cy="610" r="7" fill="#1769e8"/><text x="675" y="620" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Footsteps</text><circle cx="640" cy="665" r="7" fill="#1769e8"/><text x="675" y="675" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Estimated audibility</text><rect x="1060" y="190" width="420" height="500" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="1270" cy="315" r="90" fill="#ddf6f0"/><circle cx="1270" cy="290.3" r="30" fill="#08245a"/><path d="M 1234.25 350.75 Q 1270 308.5 1305.75 350.75 Z" fill="#08245a"/><text x="1270" y="455" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="44" fill="#1769e8">Context</text><line x1="1100" y1="495" x2="1440" y2="495" stroke="#a9caff" stroke-width="3"/><circle cx="1110" cy="555" r="7" fill="#1769e8"/><text x="1145" y="565" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Movement and stance</text><circle cx="1110" cy="610" r="7" fill="#1769e8"/><text x="1145" y="620" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Combat state</text><circle cx="1110" cy="665" r="7" fill="#1769e8"/><text x="1145" y="675" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#172744">Nearby activity</text><rect x="100" y="750" width="1400" height="90" rx="22" fill="url(#soft)" stroke="#a9caff" stroke-width="2"/><text x="800" y="807" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#08245a">Audio is inferred from server events — no raw audio is recorded.</text></svg>