<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How DayZ Behaviour Works</title><desc id="desc">Five-step overview: collect, measure, explain, analyse and review.</desc>
<defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 66px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 29px Arial;fill:#fff;text-anchor:middle}.h{font:700 34px Arial;fill:#071b48;text-anchor:middle}.b{font:25px Arial;fill:#223657;text-anchor:middle}.a{fill:#1764d8}.ph{font:700 27px Arial;fill:#1764d8}.pb{font:23px Arial;fill:#223657}.foot{font:700 28px Arial;fill:#071b48}</style></defs>
<rect width="1600" height="900" fill="#fff"/><text x="800" y="82" class="t" text-anchor="middle">How DayZ Behaviour Works</text><text x="800" y="132" class="st" text-anchor="middle">We flag behaviour that is difficult to explain through normal gameplay.</text>
<g filter="url(#s)">
<g transform="translate(55 180)"><rect class="c" width="270" height="385" rx="24"/><circle class="n" cx="52" cy="48" r="30"/><text class="nt" x="52" y="58">1</text><text class="h" x="135" y="110">Collect</text><rect x="80" y="165" width="110" height="80" rx="10" fill="#263d67"/><rect x="92" y="150" width="86" height="25" rx="9" fill="#63779d"/><circle cx="167" cy="205" r="8" fill="#35b9ff"/><text class="b" x="135" y="310"><tspan x="135">Server captures positions,</tspan><tspan x="135" dy="34">shots, actions and movement.</tspan></text></g>
<g transform="translate(360 180)"><rect class="c" width="270" height="385" rx="24"/><circle class="n" cx="52" cy="48" r="30"/><text class="nt" x="52" y="58">2</text><text class="h" x="135" y="110">Measure</text><path d="M70 215l65-50 70 40-65 50z" fill="#8bdad2" stroke="#247f86" stroke-width="5"/><circle cx="160" cy="190" r="22" fill="#1764d8"/><path d="M160 212l-11 25h22z" fill="#1764d8"/><text class="b" x="135" y="310"><tspan x="135">Check visibility, distance</tspan><tspan x="135" dy="34">and map context.</tspan></text></g>
<g transform="translate(665 180)"><rect class="c" width="270" height="385" rx="24"/><circle class="n" cx="52" cy="48" r="30"/><text class="nt" x="52" y="58">3</text><text class="h" x="135" y="110">Explain</text><path d="M75 190h38l32-28v108l-32-28H75z" fill="#1764d8" stroke="#071b48" stroke-width="5"/><path d="M160 185q28 28 0 58M185 168q44 43 0 88" fill="none" stroke="#071b48" stroke-width="8"/><ellipse cx="220" cy="210" rx="16" ry="32" fill="#4baea7" transform="rotate(-18 220 210)"/><text class="b" x="135" y="300"><tspan x="135">Estimate gunshots and footsteps.</tspan><tspan x="135" dy="34">No raw audio is recorded.</tspan></text></g>
<g transform="translate(970 180)"><rect class="c" width="270" height="385" rx="24"/><circle class="n" cx="52" cy="48" r="30"/><text class="nt" x="52" y="58">4</text><text class="h" x="135" y="110">Analyse</text><circle cx="120" cy="205" r="58" fill="#83d8cf" stroke="#247f86" stroke-width="6"/><circle cx="160" cy="235" r="36" fill="#fff" stroke="#071b48" stroke-width="6"/><path d="M185 260l30 30" stroke="#071b48" stroke-width="11" stroke-linecap="round"/><text class="b" x="135" y="310"><tspan x="135">Compare what the player did</tspan><tspan x="135" dy="34">with what they could know.</tspan></text></g>
<g transform="translate(1275 180)"><rect class="c" width="270" height="385" rx="24"/><circle class="n" cx="52" cy="48" r="30"/><text class="nt" x="52" y="58">5</text><text class="h" x="135" y="110">Review</text><circle cx="95" cy="190" r="28" fill="#344969"/><path d="M58 270q0-52 37-52t37 52z" fill="#344969"/><rect x="145" y="170" width="90" height="80" rx="8" fill="#fff" stroke="#243757" stroke-width="7"/><path d="M190 185l25 10v20c0 19-10 32-25 41-15-9-25-22-25-41v-20z" fill="#58c3b7"/><text class="b" x="135" y="310"><tspan x="135">Highest-priority incidents</tspan><tspan x="135" dy="34">go to human admins.</tspan></text></g>
</g>
<path class="a" d="M333 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22zM638 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22zM943 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22zM1248 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22z"/>
<text x="800" y="635" class="h">What the system uses</text>
<g transform="translate(95 675)"><rect class="c" width="430" height="105" rx="22"/><text x="45" y="45" class="ph">Vision</text><text x="45" y="77" class="pb">Line of sight, cover, timing</text></g><g transform="translate(585 675)"><rect class="c" width="430" height="105" rx="22"/><text x="45" y="45" class="ph">Audio</text><text x="45" y="77" class="pb">Gunshots, footsteps, distance</text></g><g transform="translate(1075 675)"><rect class="c" width="430" height="105" rx="22"/><text x="45" y="45" class="ph">Context</text><text x="45" y="77" class="pb">Movement, stance, combat state</text></g>
<rect x="90" y="820" width="1420" height="58" rx="20" fill="#f4f9ff" stroke="#bcd6fa" stroke-width="2"/><text x="800" y="858" class="foot" text-anchor="middle">Admins review the evidence — the system never automatically bans players.</text>
</svg>