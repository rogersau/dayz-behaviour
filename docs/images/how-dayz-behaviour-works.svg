<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#183765" flood-opacity="0.12"/></filter><linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#effaff"/><stop offset="1" stop-color="#e9f6f1"/></linearGradient></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="800" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="64" fill="#08245a">How DayZ Behaviour Works</text><text x="800" y="120" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#51617d">We flag behaviour that is unlikely to be explained by normal gameplay.</text><rect x="65" y="180" width="250" height="410" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="190" cy="220" r="27" fill="#1769e8"/><text x="190" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">1</text><text x="190" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#08245a">Collect</text><rect x="133.75" y="335.0" width="112.5" height="31.5" rx="10" fill="#526985" stroke="#08245a" stroke-width="4"/><circle cx="226.0" cy="350.75" r="5" fill="#35c5ff"/><rect x="133.75" y="365.0" width="112.5" height="31.5" rx="10" fill="#526985" stroke="#08245a" stroke-width="4"/><circle cx="226.0" cy="380.75" r="5" fill="#35c5ff"/><rect x="133.75" y="395.0" width="112.5" height="31.5" rx="10" fill="#526985" stroke="#08245a" stroke-width="4"/><circle cx="226.0" cy="410.75" r="5" fill="#35c5ff"/><rect x="197.5" y="417.5" width="61.5" height="45.0" rx="10" fill="#f4fbff" stroke="#08245a" stroke-width="5"/><polyline points="205.0,442.25 215.5,434.0 224.5,447.5 233.5,428.0 246.25,440.0" fill="none" stroke="#48b9ae" stroke-width="6"/><line x1="85" y1="490" x2="295" y2="490" stroke="#b6d2ff" stroke-width="2"/><text x="190" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">Positions, shots,</text><text x="190" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">actions and movement.</text><line x1="328" y1="380" x2="339" y2="380" stroke="#1769e8" stroke-width="8" stroke-linecap="round"/><path d="M 325 363 L 357 380 L 325 397 Z" fill="#1769e8"/><rect x="370" y="180" width="250" height="410" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="495" cy="220" r="27" fill="#1769e8"/><text x="495" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">2</text><text x="495" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#08245a">Measure</text><path d="M 435.0 338.75 L 476.25 323.75 L 513.75 341.0 L 555.0 326.0 V 421.25 L 513.75 436.25 L 476.25 419.0 L 435.0 434.0 Z" fill="#ccf0e9" stroke="#08245a" stroke-width="5"/><path d="M 476.25 323.75 V 419.0 M 513.75 341.0 V 436.25" stroke="#78b9b3" stroke-width="4"/><circle cx="528.75" cy="368.75" r="18" fill="#1769e8"/><path d="M 528.75 382.25 l-15 27 h30 z" fill="#1769e8"/><line x1="390" y1="490" x2="600" y2="490" stroke="#b6d2ff" stroke-width="2"/><text x="495" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">Visibility, distance</text><text x="495" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">and map context.</text><line x1="633" y1="380" x2="644" y2="380" stroke="#1769e8" stroke-width="8" stroke-linecap="round"/><path d="M 630 363 L 662 380 L 630 397 Z" fill="#1769e8"/><rect x="675" y="180" width="250" height="410" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="800" cy="220" r="27" fill="#1769e8"/><text x="800" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">3</text><text x="800" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#08245a">Explain</text><rect x="718.0" y="345.5" width="26.0" height="39.0" rx="6" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M 744.0 345.5 L 773.25 322.75 L 773.25 407.25 L 744.0 384.5 Z" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M 788.2 340.95 Q 810.3 365 788.2 389.05" fill="none" stroke="#08245a" stroke-width="7"/><path d="M 802.5 327.95 Q 835.0 365 802.5 402.05" fill="none" stroke="#08245a" stroke-width="7"/><ellipse cx="838.2" cy="395.6" rx="19" ry="31" transform="rotate(-20 838.2 395.6)" fill="#48b9ae"/><ellipse cx="871.8" cy="379.5" rx="19" ry="31" transform="rotate(18 871.8 379.5)" fill="#48b9ae"/><circle cx="825.6" cy="373.2" r="8" fill="#48b9ae"/><circle cx="884.4" cy="356.4" r="8" fill="#48b9ae"/><line x1="695" y1="490" x2="905" y2="490" stroke="#b6d2ff" stroke-width="2"/><text x="800" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">Gunshots and footsteps.</text><text x="800" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">No raw audio.</text><line x1="938" y1="380" x2="949" y2="380" stroke="#1769e8" stroke-width="8" stroke-linecap="round"/><path d="M 935 363 L 967 380 L 935 397 Z" fill="#1769e8"/><rect x="980" y="180" width="250" height="410" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="1105" cy="220" r="27" fill="#1769e8"/><text x="1105" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">4</text><text x="1105" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#08245a">Analyse</text><circle cx="1093.75" cy="372.5" r="62" fill="#dbf7ef" stroke="#08245a" stroke-width="6"/><path d="M 1093.75 329.75 v114 M 1056.25 372.5 h100" stroke="#48b9ae" stroke-width="5" opacity=".7"/><circle cx="1138.75" cy="406.25" r="40" fill="#fff" stroke="#08245a" stroke-width="7"/><line x1="1160.5" y1="428.0" x2="1186.0" y2="453.5" stroke="#08245a" stroke-width="12" stroke-linecap="round"/><line x1="1000" y1="490" x2="1210" y2="490" stroke="#b6d2ff" stroke-width="2"/><text x="1105" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">Compare actions with</text><text x="1105" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">available information.</text><line x1="1243" y1="380" x2="1254" y2="380" stroke="#1769e8" stroke-width="8" stroke-linecap="round"/><path d="M 1240 363 L 1272 380 L 1240 397 Z" fill="#1769e8"/><rect x="1285" y="180" width="250" height="410" rx="24" fill="#fff" stroke="#dce6f6" stroke-width="2" filter="url(#shadow)"/><circle cx="1410" cy="220" r="27" fill="#1769e8"/><text x="1410" y="229" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#fff">5</text><text x="1410" y="280" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34" fill="#08245a">Review</text><circle cx="1366.5" cy="346.25" r="32" fill="#50647f"/><path d="M 1332.75 413.75 Q 1366.5 372.5 1400.25 413.75 v35 h-90 Z" fill="#50647f" stroke="#08245a" stroke-width="4"/><rect x="1406.25" y="326.0" width="86.25" height="75.0" rx="8" fill="#fff" stroke="#08245a" stroke-width="7"/><path d="M 1449.0 348.5 l32 13 v30 c0 28-32 42-32 42s-32-14-32-42v-30z" fill="#48b9ae" stroke="#08245a" stroke-width="4"/><text x="1449.0" y="385.25" text-anchor="middle" font-family="Arial" font-weight="700" font-size="38" fill="#fff">!</text><line x1="1305" y1="490" x2="1515" y2="490" stroke="#b6d2ff" stroke-width="2"/><text x="1410" y="530" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">Highest-priority cases</text><text x="1410" y="555" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="20" fill="#172744">go to human admins.</text><text x="800" y="650" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="36" fill="#08245a">What we use</text><rect x="120" y="690" width="420" height="105" rx="18" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><path d="M 158.75 742 Q 185 719.25 211.25 742 Q 185 764.75 158.75 742 Z" fill="#e6fbf6" stroke="#08245a" stroke-width="6"/><circle cx="185" cy="742" r="32" fill="#48b9ae" stroke="#08245a" stroke-width="5"/><circle cx="185" cy="742" r="12" fill="#08245a"/><circle cx="181.5" cy="737.8" r="7" fill="#fff"/><text x="260" y="732" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#1769e8">Vision</text><text x="260" y="770" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19" fill="#172744">line of sight, cover, timing</text><rect x="590" y="690" width="420" height="105" rx="18" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><rect x="627.0" y="731.5" width="14.0" height="21.0" rx="6" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M 641.0 731.5 L 656.75 719.25 L 656.75 764.75 L 641.0 752.5 Z" fill="#1769e8" stroke="#08245a" stroke-width="4"/><path d="M 664.8 729.05 Q 676.7 742 664.8 754.95" fill="none" stroke="#08245a" stroke-width="7"/><path d="M 672.5 722.05 Q 690.0 742 672.5 761.95" fill="none" stroke="#08245a" stroke-width="7"/><text x="730" y="732" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#1769e8">Audio</text><text x="730" y="770" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19" fill="#172744">gunshots, footsteps, distance</text><rect x="1060" y="690" width="420" height="105" rx="18" fill="#fbfdff" stroke="#dce6f6" stroke-width="2"/><circle cx="1125" cy="728.7" r="30" fill="#08245a"/><path d="M 1105.75 761.25 Q 1125 738.5 1144.25 761.25 Z" fill="#08245a"/><text x="1200" y="732" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="28" fill="#1769e8">Context</text><text x="1200" y="770" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-size="19" fill="#172744">movement, stance, combat state</text><rect x="80" y="825" width="1440" height="55" rx="18" fill="url(#soft)" stroke="#b9d4ff"/><text x="800" y="862" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="27" fill="#08245a">This helps admins review the right incidents faster — it does not automatically ban players.</text></svg>