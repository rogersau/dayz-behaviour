<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How DayZ Behaviour Works</title>
  <desc id="desc">Five-step overview: collect, measure, explain, analyse and review.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity="0.10"/></filter>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#a8ece0"/><stop offset="1" stop-color="#56b9b1"/></linearGradient>
    <style>
      .title{font:700 66px Arial,sans-serif;fill:#071b48}.sub{font:32px Arial,sans-serif;fill:#53698f}.card{fill:#fff;stroke:#dce7f7;stroke-width:2}.step{fill:#1764d8}.steptext{font:700 30px Arial,sans-serif;fill:#fff;text-anchor:middle}.head{font:700 34px Arial,sans-serif;fill:#071b48;text-anchor:middle}.body{font:25px Arial,sans-serif;fill:#243757;text-anchor:middle}.arrow{fill:#1764d8}.label{font:700 34px Arial,sans-serif;fill:#071b48}.pill{fill:#f7fbff;stroke:#d9e7fa;stroke-width:2}.pillhead{font:700 27px Arial,sans-serif;fill:#1764d8}.pillbody{font:23px Arial,sans-serif;fill:#243757}.foot{font:700 28px Arial,sans-serif;fill:#071b48}.accent{fill:#1764d8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="82" class="title" text-anchor="middle">How DayZ Behaviour Works</text>
  <text x="800" y="132" class="sub" text-anchor="middle">We flag behaviour that is difficult to explain through normal gameplay.</text>

  <g filter="url(#shadow)">
    <g transform="translate(55 180)"><rect class="card" width="270" height="385" rx="24"/><circle class="step" cx="52" cy="48" r="30"/><text class="steptext" x="52" y="58">1</text><text class="head" x="135" y="110">Collect</text><g transform="translate(77 145)"><rect x="0" y="20" width="116" height="80" rx="10" fill="#263d67"/><rect x="12" y="6" width="92" height="26" rx="10" fill="#5f769d"/><circle cx="91" cy="59" r="8" fill="#36b9ff"/><path d="M20 122h90" stroke="#1764d8" stroke-width="8" stroke-linecap="round"/><path d="M27 104v36M63 104v36M99 104v36" stroke="#1764d8" stroke-width="8" stroke-linecap="round"/></g><text class="body" x="135" y="310"><tspan x="135">Server captures positions,</tspan><tspan x="135" dy="34">shots, actions and movement.</tspan></text></g>
    <g transform="translate(360 180)"><rect class="card" width="270" height="385" rx="24"/><circle class="step" cx="52" cy="48" r="30"/><text class="steptext" x="52" y="58">2</text><text class="head" x="135" y="110">Measure</text><g transform="translate(66 148)"><path d="M5 45l68-34 120 39-68 34z" fill="url(#teal)" stroke="#247f86" stroke-width="4"/><path d="M73 11v103M125 84v50M193 50v80" stroke="#247f86" stroke-width="4"/><circle cx="137" cy="45" r="22" fill="#1764d8"/><path d="M137 65l-10 24h20z" fill="#1764d8"/><ellipse cx="137" cy="45" rx="7" ry="8" fill="#fff"/></g><text class="body" x="135" y="310"><tspan x="135">Check visibility, distance</tspan><tspan x="135" dy="34">and map context.</tspan></text></g>
    <g transform="translate(665 180)"><rect class="card" width="270" height="385" rx="24"/><circle class="step" cx="52" cy="48" r="30"/><text class="steptext" x="52" y="58">3</text><text class="head" x="135" y="110">Explain</text><g transform="translate(58 145)"><path d="M10 44h42l36-31v112L52 94H10z" fill="#1764d8" stroke="#071b48" stroke-width="5"/><path d="M103 35q30 34 0 68M126 20q49 49 0 98" fill="none" stroke="#071b48" stroke-width="8" stroke-linecap="round"/><ellipse cx="190" cy="70" rx="19" ry="39" fill="#4baea7" transform="rotate(-18 190 70)"/><ellipse cx="160" cy="115" rx="17" ry="34" fill="#4baea7" transform="rotate(15 160 115)"/></g><text class="body" x="135" y="300"><tspan x="135">Estimate gunshots and footsteps.</tspan><tspan x="135" dy="34">No raw audio is recorded.</tspan></text></g>
    <g transform="translate(970 180)"><rect class="card" width="270" height="385" rx="24"/><circle class="step" cx="52" cy="48" r="30"/><text class="steptext" x="52" y="58">4</text><text class="head" x="135" y="110">Analyse</text><g transform="translate(68 145)"><path d="M74 10c-36 0-59 29-52 60-24 13-23 51 4 61-2 31 35 48 57 27 21 22 58 6 57-23 29-9 30-48 7-62 9-34-17-63-52-63z" fill="url(#teal)" stroke="#247f86" stroke-width="5"/><path d="M80 18v138M52 44q28 15 0 31M108 42q-25 18 1 36M45 101q25-15 38 8M107 103q27-10 28 17" fill="none" stroke="#071b48" stroke-width="5" stroke-linecap="round"/><circle cx="127" cy="127" r="37" fill="#fff" stroke="#071b48" stroke-width="6"/><path d="M153 153l30 30" stroke="#071b48" stroke-width="12" stroke-linecap="round"/></g><text class="body" x="135" y="300"><tspan x="135">Compare what the player did</tspan><tspan x="135" dy="34">with what they could know.</tspan></text></g>
    <g transform="translate(1275 180)"><rect class="card" width="270" height="385" rx="24"/><circle class="step" cx="52" cy="48" r="30"/><text class="steptext" x="52" y="58">5</text><text class="head" x="135" y="110">Review</text><g transform="translate(55 145)"><circle cx="46" cy="45" r="28" fill="#344969"/><path d="M8 130q0-52 38-52t38 52z" fill="#344969"/><rect x="91" y="28" width="118" height="98" rx="8" fill="#fff" stroke="#243757" stroke-width="8"/><path d="M150 48l30 12v22c0 22-13 37-30 47-17-10-30-25-30-47V60z" fill="#58c3b7" stroke="#247f86" stroke-width="4"/><path d="M139 82l9 10 17-23" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="body" x="135" y="300"><tspan x="135">Highest-priority incidents</tspan><tspan x="135" dy="34">go to human admins.</tspan></text></g>
  </g>

  <path class="arrow" d="M333 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22zM638 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22zM943 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22zM1248 354h22l-13-13 9-9 30 30-30 30-9-9 13-13h-22z"/>

  <text x="800" y="635" class="label" text-anchor="middle">What the system uses</text>
  <g transform="translate(95 675)"><rect class="pill" width="430" height="105" rx="22"/><circle cx="58" cy="52" r="34" fill="#d9f6f1"/><path d="M28 52q30-32 60 0-30 32-60 0z" fill="none" stroke="#071b48" stroke-width="6"/><circle cx="58" cy="52" r="10" fill="#1764d8"/><text x="110" y="45" class="pillhead">Vision</text><text x="110" y="75" class="pillbody">Line of sight, cover, timing</text></g>
  <g transform="translate(585 675)"><rect class="pill" width="430" height="105" rx="22"/><circle cx="58" cy="52" r="34" fill="#d9f6f1"/><path d="M28 40h18l16-15v54L46 64H28z" fill="#1764d8"/><path d="M69 38q18 18 0 36M80 29q29 29 0 58" fill="none" stroke="#071b48" stroke-width="5"/><text x="110" y="45" class="pillhead">Audio</text><text x="110" y="75" class="pillbody">Gunshots, footsteps, distance</text></g>
  <g transform="translate(1075 675)"><rect class="pill" width="430" height="105" rx="22"/><circle cx="58" cy="52" r="34" fill="#e9e2fb"/><circle cx="58" cy="39" r="15" fill="#4b357a"/><path d="M32 79q0-27 26-27t26 27z" fill="#4b357a"/><text x="110" y="45" class="pillhead">Context</text><text x="110" y="75" class="pillbody">Movement, stance, combat state</text></g>

  <rect x="90" y="820" width="1420" height="58" rx="20" fill="#f4f9ff" stroke="#bcd6fa" stroke-width="2"/>
  <path d="M145 834l25 10v15c0 16-10 27-25 35-15-8-25-19-25-35v-15z" fill="#1764d8"/><path d="M134 858l8 8 15-19" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="800" y="858" class="foot" text-anchor="middle">Admins review the evidence — the system never automatically bans players.</text>
</svg>