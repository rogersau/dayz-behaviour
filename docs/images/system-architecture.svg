<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">System Architecture</title><desc id="desc">DayZ telemetry flows through the collector, ingest, storage, analysis and review UI.</desc>
  <defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 28px Arial;fill:#fff;text-anchor:middle}.h{font:700 32px Arial;fill:#071b48;text-anchor:middle}.b{font:25px Arial;fill:#223657;text-anchor:middle}.arrow{fill:#1764d8}.tag{font:700 29px Arial;fill:#071b48}</style></defs>
  <rect width="1600" height="900" fill="#fff"/><text x="800" y="88" class="t" text-anchor="middle">System Architecture</text><text x="800" y="140" class="st" text-anchor="middle">From DayZ telemetry to human review.</text>
  <g filter="url(#s)">
