    <g transform="translate(300 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">2</text><text class="h" x="112" y="118">Collector Mod</text><g transform="translate(53 165)"><rect x="15" y="15" width="104" height="104" rx="16" fill="#2d496e" stroke="#071b48" stroke-width="7"/><path d="M0 36h15M0 67h15M0 98h15M119 36h15M119 67h15M119 98h15M36 0v15M67 0v15M98 0v15M36 119v15M67 119v15M98 119v15" stroke="#071b48" stroke-width="7"/><path d="M34 76h20l10-25 16 47 12-30h20" fill="none" stroke="#42c6be" stroke-width="7"/></g><text class="b" x="112" y="390"><tspan x="112">Captures bounded</tspan><tspan x="112" dy="32">gameplay events</tspan></text></g>
    <g transform="translate(565 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">3</text><text class="h" x="112" y="118">Ingest</text><g transform="translate(49 160)"><path d="M30 85q-4-42 33-49 17-33 51-12 32-9 47 23 31 0 31 35 0 30-31 33H38Q4 114 4 85q0-20 26-28" fill="#92ddd5" stroke="#247f86" stroke-width="6"/><path d="M98 115V60M73 84l25-25 25 25" fill="none" stroke="#1764d8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="43" y="130" width="112" height="58" rx="10" fill="#fff" stroke="#243757" stroke-width="6"/><text x="99" y="168" text-anchor="middle" style="font:700 30px Arial;fill:#071b48">API</text></g><text class="b" x="112" y="390"><tspan x="112">Receives and validates</tspan><tspan x="112" dy="32">telemetry</tspan></text></g>
