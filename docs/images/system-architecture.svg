<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">System Architecture</title><desc id="desc">DayZ telemetry flows through collection, ingest, storage, analysis and review.</desc><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1f44" flood-opacity=".1"/></filter><style>.t{font:700 68px Arial;fill:#071b48}.st{font:31px Arial;fill:#53698f}.c{fill:#fff;stroke:#dce7f7;stroke-width:2}.n{fill:#1764d8}.nt{font:700 28px Arial;fill:#fff;text-anchor:middle}.h{font:700 31px Arial;fill:#071b48;text-anchor:middle}.b{font:24px Arial;fill:#223657;text-anchor:middle}.a{fill:#1764d8}.tag{font:700 29px Arial;fill:#071b48}</style></defs><rect width="1600" height="900" fill="#fff"/><text x="800" y="88" class="t" text-anchor="middle">System Architecture</text><text x="800" y="140" class="st" text-anchor="middle">From DayZ telemetry to human review.</text><g filter="url(#s)"><g transform="translate(35 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">1</text><text class="h" x="112" y="118">DayZ Server</text><rect x="55" y="190" width="115" height="80" rx="10" fill="#263d67"/><rect x="69" y="174" width="87" height="27" rx="9" fill="#63779d"/><text class="b" x="112" y="390"><tspan x="112">Positions, shots,</tspan><tspan x="112" dy="32">actions</tspan></text></g><g transform="translate(300 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">2</text><text class="h" x="112" y="118">Collector Mod</text><rect x="60" y="180" width="105" height="105" rx="16" fill="#2d496e" stroke="#071b48" stroke-width="7"/><path d="M78 240h20l10-25 16 47 12-30h20" fill="none" stroke="#42c6be" stroke-width="7"/><text class="b" x="112" y="390"><tspan x="112">Captures bounded</tspan><tspan x="112" dy="32">gameplay events</tspan></text></g><g transform="translate(565 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">3</text><text class="h" x="112" y="118">Ingest</text><path d="M55 245q-4-42 33-49 17-33 51-12 32-9 47 23 31 0 31 35 0 30-31 33H63Q29 274 29 245q0-20 26-28" fill="#92ddd5" stroke="#247f86" stroke-width="6"/><path d="M123 275v-55M98 244l25-25 25 25" fill="none" stroke="#1764d8" stroke-width="9" stroke-linecap="round"/><text class="b" x="112" y="390"><tspan x="112">Receives and validates</tspan><tspan x="112" dy="32">telemetry</tspan></text></g><g transform="translate(830 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">4</text><text class="h" x="112" y="118">Storage</text><ellipse cx="112" cy="190" rx="62" ry="22" fill="#7589aa" stroke="#243757" stroke-width="6"/><rect x="50" y="190" width="124" height="105" fill="#526b93" stroke="#243757" stroke-width="6"/><ellipse cx="112" cy="295" rx="62" ry="22" fill="#526b93" stroke="#243757" stroke-width="6"/><text class="b" x="112" y="390"><tspan x="112">Raw files and</tspan><tspan x="112" dy="32">PostgreSQL</tspan></text></g><g transform="translate(1095 205)"><rect class="c" width="225" height="455" rx="26"/><circle class="n" cx="112" cy="52" r="31"/><text class="nt" x="112" y="62">5</text><text class="h" x="112" y="118">Analysis</text><circle cx="105" cy="225" r="62" fill="#83d8cf" stroke="#247f86" stroke-width="6"/><circle cx="145" cy="255" r="36" fill="#fff" stroke="#071b48" stroke-width="6"/><path d="M170 280l30 30" stroke="#071b48" stroke-width="11" stroke-linecap="round"/><text class="b" x="112" y="390"><tspan x="112">Builds evidence and</tspan><tspan x="112" dy="32">review priority</tspan></text></g><g transform="translate(1360 205)"><rect class="c" width="205" height="455" rx="26"/><circle class="n" cx="102" cy="52" r="31"/><text class="nt" x="102" y="62">6</text><text class="h" x="102" y="118">Review UI</text><circle cx="65" cy="215" r="30" fill="#344969"/><path d="M25 300q0-55 40-55t40 55z" fill="#344969"/><rect x="105" y="190" width="78" height="80" rx="8" fill="#fff" stroke="#243757" stroke-width="7"/><text class="b" x="102" y="390"><tspan x="102">Admins inspect</tspan><tspan x="102" dy="32">cases</tspan></text></g></g><path class="a" d="M267 414h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM532 414h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM797 414h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM1062 414h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25zM1327 414h25l-14-14 9-9 31 31-31 31-9-9 14-14h-25z"/><g transform="translate(165 765)"><rect width="370" height="82" rx="24" fill="#effaf8" stroke="#b8e6df" stroke-width="2"/><text x="185" y="52" class="tag" text-anchor="middle">No raw audio</text></g><g transform="translate(615 765)"><rect width="370" height="82" rx="24" fill="#f4f8ff" stroke="#c8dbfa" stroke-width="2"/><text x="185" y="52" class="tag" text-anchor="middle">Direct player IDs</text></g><g transform="translate(1065 765)"><rect width="370" height="82" rx="24" fill="#f7f3ff" stroke="#ddd0fb" stroke-width="2"/><text x="185" y="52" class="tag" text-anchor="middle">Human review</text></g></svg>